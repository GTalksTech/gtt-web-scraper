[project]
name = "gtt-web-scraper"
version = "0.1.0"
description = "Self-hosted, self-repairing web scraper with a Firecrawl-compatible API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "curl_cffi==0.10.0",
    "trafilatura==2.0.0",
    "pyyaml==6.0.2",
    "pypdf==7.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "mypy==1.15.0",
    "types-pyyaml==6.0.12.20250402",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
