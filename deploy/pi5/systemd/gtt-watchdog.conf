# Pi hardware watchdog, installed by gtt-web-scraper's install.sh into
# /etc/systemd/system.conf.d/. systemd pets /dev/watchdog0; if the kernel or
# systemd hangs for 15 s, the Pi reboots itself (15 s is about the most the
# Pi's watchdog timer can count). A shutdown stuck for 2 min is forced through.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
