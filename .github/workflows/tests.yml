# The full test suite (Seams 1–3, plus the setup wizard's and the pi5 deployment's
# tests) on every pull request to main, and as the image workflow's first job.
#
# Branch protection on main requires this workflow's `tests` check, as reported by
# GitHub Actions (scripts/setup/wizard.sh sets that up), and a pass on the fixing
# agent's pull request is what lets it merge itself (automerge.yml, ADR 0004). Keep
# the job's name `tests`: the protection rule names it.
#
# Actions are pinned to commit SHAs (tag in the comment).

name: tests

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run mypy
      - run: uv run pytest -q
      - run: bash scripts/setup/test-wizard.sh
      - run: bash deploy/pi5/test-deploy.sh
