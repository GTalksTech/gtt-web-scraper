# Local run:  docker compose up --build
# Then:       curl -s localhost:3002/v1/scrape -H 'content-type: application/json' \
#               -d '{"url": "https://docs.python.org/3/library/sqlite3.html"}'
#
# Thresholds live in config/scraper.yaml, mounted read-only so they change without a rebuild.
# This file is for local runs. pi5 runs deploy/pi5/compose.yml instead (GHCR image, tailnet-only
# port, Pi limits); see deploy/pi5/README.md.

services:
  scraper:
    build: .
    image: gtt-web-scraper:local
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./config:/app/config:ro
      # The page cache (SQLite), kept across restarts and rebuilds.
      - cache:/app/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cache:
