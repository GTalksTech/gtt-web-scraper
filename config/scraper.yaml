# gtt-web-scraper runtime config. Secrets never go here; they live in the untracked .env file.
#
# Loosening a Content Gate threshold (lower minimums, fewer markers) needs Garrett's approval
# and is excluded from auto-merge (ADR 0002).

ladder:
  # Fetchers in the order a request climbs them, cheapest first.
  - plain
  # The Paid Fetcher (Firecrawl) is always last: it spends quota. Its key comes from
  # FIRECRAWL_API_KEY in .env, never from this file.
  - paid

plain:
  # Browser whose network signature (TLS, HTTP/2, headers) the plain download imitates.
  impersonate: chrome
  timeout_s: 20

paid:
  base_url: https://api.firecrawl.dev
  timeout_s: 60
  # Once Firecrawl reports the quota exhausted, the Paid Fetcher is unavailable and
  # requests that need it fail. Every this-many seconds one request checks again
  # (a refused request costs nothing), so it comes back on its own after the monthly reset.
  quota_recheck_s: 21600

gate:
  # Extracted text shorter than this is not real content (rejected).
  min_chars: 200
  # Extracted text shorter than this passes but is thin enough to doubt (suspect).
  accepted_chars: 1000
  # Non-interactive challenges are re-fetched this many times, this far apart, before giving up.
  challenge_poll_attempts: 3
  challenge_poll_interval_s: 3.0

cache:
  # SQLite file holding the page cache and per-site memory (relative to the repo root). In a container this
  # directory needs a volume, or the cache is lost on every restart.
  path: data/scraper.db
  # A cached page younger than this is served without touching the site, unless the
  # Caller passes a smaller maxAge (0 forces a live fetch). Only accepted and suspect
  # results are cached; failures never are.
  default_max_age_s: 86400

sites:
  # A site is a URL's host name. The plain download waits at least this long between
  # requests to the same site, so the home connection doesn't get flagged.
  min_interval_s: 2
  # When a site blocks the plain download (403, 429 or a challenge), the site goes on a
  # cool-down this long: the plain download skips it and requests go straight to the
  # Paid Fetcher.
  cooldown_s: 1800
  # A request to a site starts at the Fetcher that last succeeded there, for up to this
  # long after it first did. Then one request climbs the Ladder from the bottom again,
  # so a site that once needed the Paid Fetcher doesn't spend quota on it forever.
  memory_ttl_s: 604800

adapters:
  # Site Adapters, tried before the Ladder for the URLs they handle: YouTube channels,
  # playlists and videos (public feeds), any Reddit page (its JSON view), and GitHub
  # repos, issues, pull requests, releases and files (the REST API). Their results pass
  # the Content Gate; a failed or rejected one falls back to the Ladder. A forced
  # Fetcher skips them. The YouTube and Reddit adapters use the home connection, so
  # sites.min_interval_s and cool-downs apply to them too. Remove a name to send that
  # site's URLs straight to the Ladder.
  enabled:
    - youtube
    - reddit
    - github
  timeout_s: 20
  # Where each adapter sends its requests (tests point these at fake endpoints). The
  # GitHub token comes from GITHUB_API_TOKEN in .env, never from this file.
  youtube_url: https://www.youtube.com
  reddit_url: https://www.reddit.com
  github_api_url: https://api.github.com

search:
  # Search Providers in the order a query tries them. A Provider that fails, runs out of
  # quota, has no key in .env or finds nothing passes the query to the next; when every
  # one fails, the Caller gets an explicit failure naming each Provider's error. Re-order
  # or replace Providers here. Firecrawl is never a Search Provider (it spends quota).
  # Keys come from TINYFISH_API_KEY, EXA_API_KEY and TAVILY_API_KEY in .env; DuckDuckGo
  # needs none.
  providers:
    - tinyfish
    - exa
    - tavily
    - duckduckgo
  timeout_s: 15
  # A query's results are served from the search cache for this long (24 hours), so
  # repeated searches don't spend free Provider quota.
  cache_max_age_s: 86400
  # The Source List (trusted domains boosted, blocked domains dropped) is always
  # config/source-list.yaml, beside this file, so a policy check can diff it on its own:
  # removing a domain needs Garrett's approval (ADR 0002). It is not a setting here.
  # Where each Provider is reached (tests point these at fake Providers).
  tinyfish_url: https://api.search.tinyfish.ai
  exa_url: https://api.exa.ai
  tavily_url: https://api.tavily.com
  duckduckgo_url: https://html.duckduckgo.com

health:
  # Rolling success rates per Fetcher, Search Provider and Site Adapter, counted over
  # this window (24 hours); see them at /health/fetchers, /health/providers and
  # /health/adapters. Attempts skipped for a cool-down, and searches served from the
  # cache, aren't counted; ones refused because a Fetcher or Provider is unavailable
  # (quota exhausted, or a Provider's key not set) are counted apart, and a quota
  # running out raises its own Incident.
  window_s: 86400
  # A Fetcher, Provider or adapter with fewer attempts than this in the window isn't judged.
  min_attempts: 10
  # One whose share of successful attempts falls below this raises an Incident. The
  # plain download is rejected on hard sites as a matter of course, and a Provider that
  # finds nothing counts as failing, so this is a floor for a quiet slide, not a
  # target. Lowering it loosens a check and needs Garrett's approval (ADR 0002).
  min_success_rate: 0.5
  # When at least this share of the Canary Set's checks (pages and searches) fails at
  # once, it's one widespread Incident instead of one per site, Site Adapter or Search
  # Provider. The Canary Set itself is config/canary.yaml.
  widespread_fraction: 0.5
