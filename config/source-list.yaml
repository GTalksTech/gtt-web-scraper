# The Source List: domains search trusts (boosted above other results) and blocks
# (dropped from results). An entry covers the domain and all its subdomains
# (github.com covers docs.github.com); a blocked entry beats a trusted one above it
# (blocking spam.github.com would drop it even though github.com is trusted). It
# shapes which sources Callers see; it does not judge whether any claim is true.
#
# Policy (ADR 0002, spec #1 story 51): the fixing agent may ADD domains to either list.
# Removing a domain, or moving one from blocked to trusted, needs Garrett's approval and
# is excluded from auto-merge. Keep one bare domain per line (no scheme, no path) so a
# policy check can diff this file line by line: any removed line is a loosening.
#
# Seeded 2026-11 for G Talks Tech research (network engineering, AI, tech) plus
# general primary sources. Domains on neither list are shown in the Provider's order.

